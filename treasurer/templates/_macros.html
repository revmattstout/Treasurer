{% macro csrf() %}<input type="hidden" name="csrf" value="{{ csrf_token }}">{% endmacro %}
{% macro month_picker(months, current, endpoint, extra={}) %}
<form method="get" action="{{ url_for(endpoint) }}" class="inline">
  {% for k, v in extra.items() %}{% if v %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endif %}{% endfor %}
  <select name="month" onchange="this.form.submit()">
    <option value="">All months</option>
    {% for m in months %}<option value="{{ m }}" {{ 'selected' if m == current }}>{{ m|month_name }}</option>{% endfor %}
  </select>
</form>
{% endmacro %}
